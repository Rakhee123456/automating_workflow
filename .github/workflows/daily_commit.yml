name: Autonomous Daily Python Push

on:
  schedule:
    # Runs every day at 00:00 UTC (Change time if desired)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Execute Daily Python Script
        run: |
          python main.py

      - name: 🚀 Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            COMMIT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "🤖 Auto update: Python daily commit - $COMMIT_DATE"
            git push origin main
          else
            echo "No changes detected to commit."
          fi
